<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrimsonFlame — Archive Build V1</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/TBkJR2Jn/unnamed-removebg-preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0A0A0E; color: #FFF; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .version-ribbon {
            background: linear-gradient(135deg, #FF6B00, #FF2A00);
            color: #FFF; text-align: center; font-weight: 800; font-size: 0.85rem; padding: 8px 16px;
            letter-spacing: 0.5px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;
        }
        .version-ribbon a { color: #FFF; text-decoration: underline; font-weight: 700; }
        .hero { text-align: center; padding: 80px 20px; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-family: 'Outfit', sans-serif; font-size: 3.5rem; font-weight: 900; background: linear-gradient(135deg, #FFF, #FF6B00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: #A0A0B0; font-size: 1.1rem; line-height: 1.6; margin-top: 16px; }
        .badge { display: inline-block; padding: 6px 16px; border-radius: 20px; background: rgba(255,107,0,0.15); border: 1px solid rgba(255,107,0,0.4); color: #FF6B00; font-weight: 700; font-size: 0.82rem; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="version-ribbon">
        <span>🏛️ ARCHIVED BUILD V1 • INITIAL STUDIO RELEASE</span>
        <a href="../">← Return to Vault</a>
    </div>

    <section class="hero">
        <span class="badge">V1.0.0 Snapshot</span>
        <h1>CrimsonFlame V1</h1>
        <p>The original initial release of CrimsonFlame. Featuring multi-page Quest VR game showcases, spatial vector movement labs, and initial community portals.</p>
    </section>
</body>
</html>
